services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      SUPPORTBENCH_SIMULATOR_DB: ${SUPPORTBENCH_SIMULATOR_DB}
      SUPPORTBENCH_SIMULATOR_DB_USER: ${SUPPORTBENCH_SIMULATOR_DB_USER}
      SUPPORTBENCH_SIMULATOR_DB_PASSWORD: ${SUPPORTBENCH_SIMULATOR_DB_PASSWORD}

      MLFLOW_DB: ${MLFLOW_DB}
      MLFLOW_DB_USER: ${MLFLOW_DB_USER}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 10s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION}

    restart: unless-stopped

    environment:
      MLFLOW_BACKEND_STORE_URI: >-
        postgresql+psycopg2://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@postgres:5432/${MLFLOW_DB}

      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts

    command:
      - /bin/sh
      - -c
      - |
        exec mlflow server \
          --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI" \
          --artifacts-destination "$$MLFLOW_ARTIFACTS_DESTINATION" \
          --host 0.0.0.0 \
          --port 5000 \
          --allowed-hosts "localhost:5000,127.0.0.1:5000,mlflow:5000"

    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT}:5000"

    volumes:
      - mlflow_artifacts:/mlflow/artifacts

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile

    command:
      - alembic
      - upgrade
      - head

    environment:
      SUPPORTBENCH_SIMULATOR_DATABASE_URL: >-
        postgresql+psycopg://${SUPPORTBENCH_SIMULATOR_DB_USER}:${SUPPORTBENCH_SIMULATOR_DB_PASSWORD}@postgres:5432/${SUPPORTBENCH_SIMULATOR_DB}

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile

    environment:
      SUPPORTBENCH_PROJECT_ROOT: /app

      SUPPORTBENCH_SIMULATOR_DATABASE_URL: >-
        postgresql+psycopg://${SUPPORTBENCH_SIMULATOR_DB_USER}:${SUPPORTBENCH_SIMULATOR_DB_PASSWORD}@postgres:5432/${SUPPORTBENCH_SIMULATOR_DB}

      SUPPORTBENCH_OLLAMA_BASE_URL: http://host.docker.internal:11434

      SUPPORTBENCH_AGENT_MODEL: ${SUPPORTBENCH_AGENT_MODEL:-qwen3:4b}
      SUPPORTBENCH_MODEL_TOKENIZER: Qwen/Qwen3-4B

      SUPPORTBENCH_DENSE_DEVICE: cpu
      SUPPORTBENCH_RERANKER_DEVICE: cpu

      SUPPORTBENCH_AGENT_THINK: "true"

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./data/nvidia_techqa:/app/data/nvidia_techqa:ro
      - ./artifacts/nvidia_techqa:/app/artifacts/nvidia_techqa:ro
      - huggingface_cache:/root/.cache/huggingface

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  mlflow_artifacts:
  huggingface_cache:
