services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"

    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 10s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION}

    restart: unless-stopped

    environment:
      MLFLOW_BACKEND_STORE_URI: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts

    command:
      - /bin/sh
      - -c
      - |
        exec mlflow server \
          --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI" \
          --artifacts-destination "$$MLFLOW_ARTIFACTS_DESTINATION" \
          --host 0.0.0.0 \
          --port 5000 \
          --allowed-hosts "localhost:5000,127.0.0.1:5000,mlflow:5000"

    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT}:5000"

    volumes:
      - mlflow_artifacts:/mlflow/artifacts

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mlflow_postgres_data:
  mlflow_artifacts:
